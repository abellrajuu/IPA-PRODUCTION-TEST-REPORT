plugins {
    id 'com.android.application'
}

if (System.getProperty("os.name").toLowerCase().contains("windows") && new File("C:/Users/Admin").exists()) {
    layout.buildDirectory.set(file("C:/Users/Admin/AppData/Local/Temp/android_build/app"))
}

android {
    namespace 'com.production.reportapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.production.reportapp"
        minSdk 21
        targetSdk 34
        versionCode 7
        versionName "3.2.0"
    }

    signingConfigs {
        release {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
