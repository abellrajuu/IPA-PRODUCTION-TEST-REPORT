plugins {
    id 'com.android.application'
}

layout.buildDirectory.set(file("C:/Users/Admin/AppData/Local/Temp/android_build/app"))

android {
    namespace 'com.production.reportapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.production.reportapp"
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "3.1.4"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
