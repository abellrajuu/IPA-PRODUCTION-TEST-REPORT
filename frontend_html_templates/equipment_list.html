<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Equipment List Form</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0284c7">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <meta name="app-build-version" content="{{ build_version }}">
    <style>
        .pdf-download-banner { background: linear-gradient(135deg, #0284c7, #0ea5e9); border-radius: 16px; padding: 20px 24px; margin-top: 24px; display: flex; justify-content: space-between; align-items: center; color: #ffffff; box-shadow: 0 10px 25px rgba(0, 158, 227, 0.3); }
        .section-box { background: #ffffff; border: 1.5px solid #e2e8f0; border-radius: 18px; padding: 28px 24px; margin-bottom: 24px; box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04); display: block; }
        .section-box-title { font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 800; color: #0f172a; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1.5px solid #e2e8f0; padding-bottom: 12px; }
        .section-box-title i { color: #009ee3; font-size: 18px; }
        .table-input { width: 100%; border: 1px solid #cbd5e1; border-radius: 6px; padding: 6px 8px; font-size: 13px; }
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 16px; border-radius: 12px; }
        .table-responsive .data-table { min-width: 900px; }
    </style>
</head>
<body style="padding: 16px;">
    <div class="app-container" style="max-width: 1180px; margin: 0 auto;">
        <header class="app-header">
            <div class="app-title">
                <h1>List of Instruments / Equipment</h1>
            </div>
            <div class="header-actions" style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                <button type="button" id="btnAutoFillHeader" class="header-nav-link btnFillDemoDataGlobal" onclick="triggerUniversalAutoFill();" style="background: linear-gradient(135deg, #0284c7, #0369a1); color: #ffffff !important; border: none; font-weight: 800; cursor: pointer; padding: 10px 18px; border-radius: 10px; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Auto-Fill Demo
                </button>
                <a href="/portal" class="header-nav-link">
                    <i class="fa-solid fa-house"></i> Home
                </a>
            </div>
        </header>

        <main class="tab-content active">
            <form id="recordForm" autocomplete="off">
                <input type="hidden" name="report_type" value="equipment_list">
                <input type="file" id="gaFileInput" accept=".dwg,.dxf,.json" style="display:none;">

                <div class="glass-form" style="padding: 28px;">
                    <div class="section-box">
                        <div class="section-box-title"><i class="fa-solid fa-circle-info"></i> 1. Register Metadata</div>
                        <div class="grid-col-2">
                            <div class="input-group">
                                <label for="job_no">Document / Register Reference No.</label>
                                <input type="text" name="job_no" id="job_no" placeholder="e.g. EQ-REG-2026" required>
                            </div>
                            <div class="input-group">
                                <label for="date">Updated Date</label>
                                <input type="date" name="date" id="date" required>
                            </div>
                            <div class="input-group">
                                <label for="customer">Department / Lab</label>
                                <input type="text" name="customer" id="customer" value="QUALITY CONTROL LAB">
                            </div>
                            <div class="input-group">
                                <label for="tested_by">Prepared By</label>
                                <input type="text" name="tested_by" id="tested_by" placeholder="Engineer name" required>
                            </div>
                        </div>
                    </div>

                    <div class="section-box">
                        <div class="section-box-title"><i class="fa-solid fa-screwdriver-wrench"></i> 2. Instruments &amp; Calibration Status (Rows 1–20)</div>
                        <div class="table-responsive">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th style="width: 70px;">SL NO.</th>
                                        <th>DESCRIPTION</th>
                                        <th>REF / ID NO.</th>
                                        <th style="width: 135px;">CAL. DATE</th>
                                        <th style="width: 135px;">DUE DATE</th>
                                        <th>CAL. AGENCY</th>
                                        <th>REMARKS</th>
                                    </tr>
                                </thead>
                                <tbody id="equipmentRowsBody"></tbody>
                            </table>
                        </div>

                        <div class="grid-col-2" style="margin-top: 16px;">
                            <div class="input-group">
                                <label for="approved_by">Approved By</label>
                                <input type="text" name="approved_by" id="approved_by" placeholder="QC Manager">
                            </div>
                        </div>

                        <div class="form-actions" style="margin-top: 24px; display: flex; gap: 16px; justify-content: flex-end; align-items: center;">
                            <button type="submit" id="btnSubmitPDF" class="btn-primary" style="display: inline-flex; padding: 14px 28px; font-size: 15px; border-radius: 12px;">Submit &amp; Generate Report</button>
                        </div>
                    </div>
                </div>
            </form>

            <div id="downloadBanner" class="pdf-download-banner" style="display: none; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;">
                <div>
                    <h4 style="font-size: 16px; font-weight: 800; margin: 0 0 4px 0; color: #ffffff;">Report Generated Successfully!</h4>
                    <p id="downloadFilename" style="font-size: 13px; opacity: 0.9; margin: 0; color: #e0f2fe;"></p>
                </div>
                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <button type="button" id="btnBannerPreviewPDF" class="btn-secondary" style="padding: 10px 18px; font-size: 14px; font-weight: 700; background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.35); color: #ffffff; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;">Preview PDF</button>
                    <a id="btnDownloadDOCX" href="#" target="_blank" class="btn-secondary" style="background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.35); color: #ffffff; font-weight: 700; padding: 10px 18px; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;">Download DOCX</a>
                    <a id="btnDownloadPDF" href="#" target="_blank" class="btn-primary" style="background: #ffffff; color: #0284c7; font-weight: 800; padding: 10px 20px; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;">Download PDF</a>
                </div>
            </div>
        </main>
    </div>

    <div id="pdfPreviewModal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="width: 92%; max-width: 960px; height: 88vh; display: flex; flex-direction: column;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="margin: 0;">Report Preview</h3>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <a id="btnModalDownloadPDF" href="#" target="_blank" class="btn-primary" style="padding: 8px 16px; border-radius: 8px; text-decoration: none;">Download PDF</a>
                    <button type="button" id="btnClosePreviewModal" class="btn-secondary" style="padding: 8px 14px; border-radius: 8px;">&times;</button>
                </div>
            </div>
            <iframe id="pdfPreviewIframe" style="flex: 1; width: 100%; border: 1px solid #cbd5e1; border-radius: 10px;"></iframe>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        (function buildEquipmentRows() {
            const tbody = document.getElementById('equipmentRowsBody');
            if (!tbody) return;
            for (let i = 1; i <= 20; i++) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input type="text" class="table-input" name="eq_${i}_sl" id="eq_${i}_sl" value="${i}" style="text-align:center;"></td>
                    <td><input type="text" class="table-input" name="eq_${i}_desc" id="eq_${i}_desc" placeholder="Instrument name"></td>
                    <td><input type="text" class="table-input" name="eq_${i}_ref" id="eq_${i}_ref" placeholder="ID / Make / Sr. No."></td>
                    <td><input type="date" class="table-input" name="eq_${i}_cal_date" id="eq_${i}_cal_date"></td>
                    <td><input type="date" class="table-input" name="eq_${i}_due_date" id="eq_${i}_due_date"></td>
                    <td><input type="text" class="table-input" name="eq_${i}_agency" id="eq_${i}_agency" placeholder="NABL Lab"></td>
                    <td><input type="text" class="table-input" name="eq_${i}_remarks" id="eq_${i}_remarks" placeholder="Valid"></td>
                `;
                tbody.appendChild(tr);
            }
        })();

        window.pageCustomFiller = function () {
            if (typeof setFieldValue !== 'function') return;
            const today = new Date();
            const due = new Date(today.getFullYear() + 1, today.getMonth(), today.getDate());
            const calStr = today.toISOString().split('T')[0];
            const dueStr = due.toISOString().split('T')[0];
            setFieldValue('job_no', 'EQ-LIST-2026');
            setFieldValue('date', calStr);
            setFieldValue('customer', 'QUALITY CONTROL LAB');
            setFieldValue('tested_by', 'R. Sharma');
            setFieldValue('approved_by', 'S. Kumar');
            const samples = [
                ['1', 'Digital Multimeter 5.5 Digit', 'FLK-8808A-01', calStr, dueStr, 'ERTL Calibration', 'OK'],
                ['2', 'mV / Load Cell Simulator', 'TMC-LCS-04', calStr, dueStr, 'NABL Metrology', 'OK'],
                ['3', 'Dead Weight Test Set 20 kg', 'DWT-M1-20', calStr, dueStr, 'Legal Metrology', 'OK'],
                ['4', 'Digital Tachometer', 'LUT-DT2234', calStr, dueStr, 'NABL Metrology', 'OK'],
                ['5', 'Function Generator 20 MHz', 'SCI-FG20-02', calStr, dueStr, 'ERTL Calibration', 'OK']
            ];
            samples.forEach((row, idx) => {
                const i = idx + 1;
                setFieldValue(`eq_${i}_sl`, row[0]);
                setFieldValue(`eq_${i}_desc`, row[1]);
                setFieldValue(`eq_${i}_ref`, row[2]);
                setFieldValue(`eq_${i}_cal_date`, row[3]);
                setFieldValue(`eq_${i}_due_date`, row[4]);
                setFieldValue(`eq_${i}_agency`, row[5]);
                setFieldValue(`eq_${i}_remarks`, row[6]);
            });
        };
    </script>
</body>
</html>
